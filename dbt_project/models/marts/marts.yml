version: 2

models:
  - name: dim_customers
    description: Current customer dimension; incremental merges retain the latest accepted attributes.
    columns:
      - name: customer_id
        description: Customer key used by order facts.
        data_tests:
          - not_null
          - unique
      - name: email
        data_tests:
          - not_null
  - name: dim_products
    description: Current product dimension with standardized catalog attributes.
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique
      - name: category
        data_tests:
          - accepted_values:
              arguments:
                values: ["apparel", "beauty", "electronics", "home", "sports"]
  - name: fact_orders
    description: One row per accepted order with source total and summed accepted line amounts.
    columns:
      - name: order_id
        description: Order grain and primary key of this fact.
        data_tests:
          - not_null
          - unique
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: total_amount
        data_tests:
          - not_null
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ["cancelled", "delivered", "pending", "processing", "shipped"]
