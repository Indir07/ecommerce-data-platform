version: 2

models:
  - name: stg_customers
    description: Typed customer records from the raw ingestion layer.
    columns:
      - name: customer_id
        description: Stable customer identifier from the source system.
        data_tests:
          - not_null
          - unique
      - name: email
        data_tests:
          - not_null
      - name: signup_date
        data_tests:
          - not_null
  - name: stg_products
    description: Typed product catalog records.
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique
      - name: unit_price
        data_tests:
          - not_null
  - name: stg_orders
    description: Typed order headers with their accepted customer references.
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ["cancelled", "delivered", "pending", "processing", "shipped"]
  - name: stg_order_items
    description: Typed order line records with positive quantities and prices.
    columns:
      - name: order_item_id
        data_tests:
          - not_null
          - unique
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: quantity
        data_tests:
          - not_null
